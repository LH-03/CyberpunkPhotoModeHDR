[Output]
# faithful = only the user-approved faithful Ultra HDR photo
# rich     = only the optional rich Ultra HDR photo
# both     = one Gate7 readback, then sequentially encode both photos on CPU
mode=faithful

# faithful = replace the game's Gallery PNG with the faithful SDR fallback
# rich     = replace it with the rich SDR fallback
# off      = leave the game's original PNG untouched (v0.1 public default)
# When enabled, the original native PNG is preserved in .CyberpunkPhotoModeHDR.
gallery=off
